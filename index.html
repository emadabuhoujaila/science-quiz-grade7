:root{--p:#1a6b3c;--pl:#2d9e5f;--s:#0d4f8b;--a:#f0a500;--d:#c0392b;--ok:#27ae60;--bg:#f4f7f6;--t:#2c3e50;--b:#dce3e0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:var(--bg);color:var(--t)}
.screen{display:none}
.full{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1a6b3c,#0d4f8b)}
.card{background:#fff;border-radius:16px;padding:30px 26px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,.25);text-align:center}
.card h2{color:var(--p);margin:6px 0 4px}.card .sub{color:#666;font-size:.85rem;margin-bottom:14px}
.fg{margin-bottom:13px;text-align:start}.fg label{display:block;margin-bottom:5px;font-weight:600;font-size:.88rem}
input,select,textarea{width:100%;padding:9px 12px;border:2px solid var(--b);border-radius:8px;font-size:.92rem;color:var(--t);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p)}
textarea{font-family:Consolas,monospace;font-size:.8rem;direction:ltr;text-align:left}
.bigbtn{display:block;width:100%;padding:14px;border:none;border-radius:10px;color:#fff;font-size:1.02rem;font-weight:700;cursor:pointer;margin-top:12px}
.g{background:linear-gradient(135deg,#1a6b3c,#2d9e5f)}.bl{background:linear-gradient(135deg,#0d4f8b,#1a237e)}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:.88rem;font-weight:600;color:#fff;background:var(--p)}
.btn:hover{opacity:.9}.btn.s{background:var(--s)}.btn.a{background:var(--a)}.btn.d{background:var(--d)}.btn.gr{background:#e8eceb;color:var(--t)}
.btn.sm{padding:4px 10px;font-size:.76rem}
a.lnk{color:var(--s);font-size:.83rem;cursor:pointer;text-decoration:underline;display:inline-block;margin-top:12px}
.fbst{display:inline-block;font-size:.76rem;padding:3px 10px;border-radius:10px}
.fbst.ok{background:#d5f5e3;color:#1e8449}.fbst.err{background:#fde8e6;color:#922b21}.fbst.wait{background:#fef9e7;color:#7d6608}
.top{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:1rem}.top .sub{font-size:.76rem;opacity:.85}
.timer{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);border-radius:8px;padding:5px 14px;font-size:1.25rem;font-weight:700;min-width:84px;text-align:center}
.timer.w{background:rgba(240,165,0,.5)}.timer.x{background:rgba(192,57,43,.7)}
.body{max-width:820px;margin:0 auto;padding:16px 14px 40px}
.wide{max-width:1180px;margin:0 auto;padding:16px 14px 50px}
.sbar{background:#fff;border-radius:10px;padding:9px 14px;margin-bottom:12px;display:flex;justify-content:space-between;font-size:.83rem;color:#555;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--b);background:#fff;cursor:pointer;font-size:.76rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.dot.on{border-color:var(--s);color:var(--s)}.dot.ans{background:var(--p);color:#fff;border-color:var(--p)}
.pbg{background:#e8eceb;border-radius:8px;height:7px;margin-bottom:12px}.pb{height:7px;background:linear-gradient(90deg,var(--p),var(--pl));border-radius:8px;transition:width .3s}
.qc{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:12px}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qn{background:var(--p);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0}
.qt{font-size:.96rem;line-height:1.7;font-weight:500;white-space:pre-wrap}
.tb{font-size:.7rem;background:#e8f4fd;color:var(--s);padding:2px 9px;border-radius:10px;font-weight:600;display:inline-block;margin-bottom:4px}
.qimg{max-width:100%;max-height:300px;border-radius:8px;margin:8px 0;border:1px solid var(--b);display:block}
.opts{list-style:none;display:flex;flex-direction:column;gap:7px}
.opts label{display:flex;align-items:center;gap:9px;padding:9px 12px;border:2px solid var(--b);border-radius:8px;cursor:pointer;font-size:.9rem}
.opts label:hover{border-color:var(--p);background:#f0faf5}.opts input{width:auto;accent-color:var(--p)}
.opts li.sel label{border-color:var(--p);background:#eafaf1}
.tf{display:flex;gap:10px}.tf button{flex:1;padding:11px;border:2px solid var(--b);border-radius:8px;background:#fff;cursor:pointer;font-size:.97rem;font-weight:600}
.tf button.sel{border-color:var(--p);background:#eafaf1}
.mr{display:flex;align-items:center;gap:9px;margin-bottom:7px}.ml{flex:1;background:#f0f4f8;padding:8px 11px;border-radius:6px;font-size:.88rem}.mr select{flex:1}
.oi{display:flex;align-items:center;gap:8px;padding:8px 11px;background:#f9fafb;border:2px solid var(--b);border-radius:8px;margin-bottom:5px;font-size:.88rem}
.oi span.tx{flex:1}.oi button{border:none;background:#e8eceb;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:1rem}
.nav{display:flex;justify-content:space-between;gap:9px;margin-top:12px}
.res{max-width:760px;margin:0 auto;padding:18px 14px 40px}
.rc{background:#fff;border-radius:16px;padding:26px;box-shadow:0 4px 16px rgba(0,0,0,.1);margin-bottom:14px}
.circ{width:130px;height:130px;border-radius:50%;margin:0 auto 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:2rem}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.sb{background:#f4f7f6;border-radius:10px;padding:10px 16px;min-width:100px}.sb .n{font-size:1.3rem;font-weight:800}.sb .l{font-size:.74rem;color:#666}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.84rem}.bar .bg{flex:1;background:#e8eceb;border-radius:6px;height:12px;overflow:hidden}.bar .f{height:12px;border-radius:6px}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.74rem;font-weight:600;margin:2px}
.tag.g{background:#d5f5e3;color:#1e8449}.tag.r{background:#fde8e6;color:#922b21}.tag.y{background:#fef9e7;color:#7d6608}.tag.b{background:#e8f4fd;color:#0d4f8b}
/* dashboard */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:9px 16px;border:2px solid var(--b);background:#fff;border-radius:10px;cursor:pointer;font-weight:700;font-size:.86rem;color:var(--t)}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.sub-tabs button{padding:6px 14px;font-size:.8rem;border-radius:8px}.sub-tabs button.on{background:var(--s);border-color:var(--s)}
.pn{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.07);margin-bottom:14px}
.pn h3{color:var(--p);margin-bottom:10px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.84rem}
th{background:var(--p);color:#fff;padding:8px 10px;text-align:center;white-space:nowrap}td{padding:7px 10px;border-bottom:1px solid #eee;text-align:center}
td.n{text-align:start}tr:nth-child(even) td{background:#fafcfb}.red{color:var(--d);font-weight:700}.grn{color:var(--ok);font-weight:700}
.note{background:#fffbf0;border-right:4px solid var(--a);padding:9px 12px;border-radius:6px;font-size:.84rem;color:#7d6608;margin-bottom:10px;line-height:1.7}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1;min-width:130px}
.pq{border:1px solid var(--b);border-radius:8px;padding:10px;margin-bottom:8px;font-size:.85rem;background:#fcfdfc}

.lov{position:fixed;inset:0;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;z-index:99;font-weight:700;color:var(--p)}
.ok-m{color:var(--ok)}.bad-m{color:var(--d)}

function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(n,seed){var a=[],i;for(i=0;i<n;i++)a.push(i);var h=hash(seed)||1;
  function rnd(){h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296}
  for(i=n-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function showLocked(){

function startExam(ex,sec,sid,act){
  var sc=secOf(sec);

  ST={ex:ex,sec:sec,sid:sid,ans:[],cur:0,active:true,base:0,t0:Date.now()};
  if(act&&act.ans){try{ST.ans=JSON.parse(act.ans).map(function(x){return x===null?undefined:x})}catch(e){}ST.base=act.el||0}
  document.documentElement.dir=L.dir;
  $('qSchool').textContent=L.school;$('qTitle').textContent=ex.title;
  var st=STUDENTS[sec].filter(function(s){return s.id===sid})[0];

  $('bPrev').textContent=L.prev;$('bNext').textContent=L.next;$('bSub').textContent=L.submit;
  SS('quizScreen');renderQ();
  db.ref(P.act+'/'+ex.id+'/'+sid).update({run:true,ts:now()});

}
function elapsed(){return ST.base+(Date.now()-ST.t0)/1000}
function tick(){
  if(!ST||!ST.active)return;
  var rem=Math.max(0,Math.round(ST.ex.duration*60-elapsed()));
  var m=Math.floor(rem/60),s=rem%60,el=$('timerEl');
  el.textContent=pad(m)+':'+pad(s);el.className='timer'+(rem<=60?' x':rem<=300?' w':'');
  if(rem<=0)doSubmit();
}
function saveActive(){

  db.ref(P.act+'/'+ST.ex.id+'/'+ST.sid).update({ans:JSON.stringify(ST.ans.map(function(x){return x===undefined?null:x})),el:Math.round(elapsed()),ts:now()});
}
// ── anti-cheat ──
var armed=false;
function armLock(){
  if(armed)return;armed=true;
  document.addEventListener('visibilitychange',function(){if(document.hidden)lockNow()});
  window.addEventListener('blur',function(){lockNow()});
  window.addEventListener('pagehide',function(){lockNow()});
  window.addEventListener('beforeunload',function(){lockNow()});
}
function lockNow(){
  if(!ST||!ST.active)return;
  ST.active=false;clearInterval(tInt);clearInterval(saveInt);
  var base=P.act+'/'+ST.ex.id+'/'+ST.sid;
  var o={};
  o[P.lock+'/'+ST.ex.id+'/'+ST.sid]={ts:now(),why:'left'};
  o[base+'/ans']=JSON.stringify(ST.ans.map(function(x){return x===undefined?null:x}));
  o[base+'/el']=Math.round(elapsed());o[base+'/run']=false;

// ── questions ──
function qDefault(q,i){
  if(q.t==='order'){var n=q.items.length,p=shuffled(n,ST.sid+ST.ex.id+i),sorted=p.every(function(v,k){return v===k});if(sorted&&n>1){p.push(p.shift())}return p}
  if(q.t==='match'){return q.pairs.map(function(){return -1})}
  return undefined;
}
function getAns(i){var q=ST.ex.questions[i];if(ST.ans[i]===undefined&&(q.t==='order'||q.t==='match'))ST.ans[i]=qDefault(q,i);return ST.ans[i]}
function isAnswered(i){var q=ST.ex.questions[i],a=ST.ans[i];if(a===undefined||a===null)return false;
  if(q.t==='fill')return String(a).trim()!=='';if(q.t==='match')return arrOf(a).every(function(v){return v>=0});if(q.t==='order')return true;return true}
function renderQ(){
  var i=ST.cur,qs=ST.ex.questions,q=qs[i];getAns(i);
  var h='<div class="qc"><div class="qh"><div class="qn">'+(i+1)+'</div><div style="flex:1"><div class="tb">'+L.q+' '+(i+1)+' '+L.of+' '+qs.length+'</div><div class="qt">'+esc(q.q)+'</div></div></div>';
  if(q.img)h+='<img class="qimg" src="'+q.img+'">';
  var a=ST.ans[i];
  if(q.t==='mcq'){h+='<ul class="opts">'+q.opts.map(function(o,k){return'<li class="'+(a===k?'sel':'')+'"><label><input type="radio" name="o" '+(a===k?'checked':'')+' onchange="setA('+k+')"> <span>'+esc(o)+'</span></label></li>'}).join('')+'</ul>'}
  else if(q.t==='tf'){h+='<div class="tf"><button class="'+(a===true?'sel':'')+'" onclick="setA(true)">✔ '+L.t+'</button><button class="'+(a===false?'sel':'')+'" onclick="setA(false)">✘ '+L.f+'</button></div>'}
  else if(q.t==='fill'){h+='<input type="text" value="'+esc(a||'')+'" placeholder="'+L.fill+'" oninput="setA(this.value,true)" autocomplete="off">'}
  else if(q.t==='match'){var perm=shuffled(q.pairs.length,ST.sid+ST.ex.id+'m'+i);
    h+=q.pairs.map(function(p,k){return'<div class="mr"><div class="ml">'+esc(p[0])+'</div><select onchange="setM('+k+',this.value)"><option value="-1">'+L.choose+'</option>'+perm.map(function(r){return'<option value="'+r+'" '+(a[k]===r?'selected':'')+'>'+esc(q.pairs[r][1])+'</option>'}).join('')+'</select></div>'}).join('')}
  else if(q.t==='order'){h+=a.map(function(idx,pos){return'<div class="oi"><b>'+(pos+1)+'</b><span class="tx">'+esc(q.items[idx])+'</span><button onclick="mv('+pos+',-1)">▲</button><button onclick="mv('+pos+',1)">▼</button></div>'}).join('')}
  h+='</div>';$('qCont').innerHTML=h;
  $('bPrev').style.visibility=i===0?'hidden':'visible';
  $('bNext').style.display=i===qs.length-1?'none':'inline-block';
  $('pbEl').style.width=((i+1)/qs.length*100)+'%';
  $('dotsEl').innerHTML=qs.map(function(_,k){return'<div class="dot'+(k===i?' on':'')+(isAnswered(k)?' ans':'')+'" onclick="jump('+k+')">'+(k+1)+'</div>'}).join('');
}
function setA(v,noRender){ST.ans[ST.cur]=v;if(!noRender)renderQ();else updDots()}
function updDots(){var d=$('dotsEl').children;for(var k=0;k<d.length;k++){d[k].className='dot'+(k===ST.cur?' on':'')+(isAnswered(k)?' ans':'')}}
function setM(k,v){getAns(ST.cur);ST.ans[ST.cur][k]=parseInt(v);updDots()}
function mv(pos,d){var a=ST.ans[ST.cur],j=pos+d;if(j<0||j>=a.length)return;var t=a[pos];a[pos]=a[j];a[j]=t;renderQ()}
function goQ(d){var n=ST.cur+d;if(n<0||n>=ST.ex.questions.length)return;ST.cur=n;renderQ();saveActive()}
function jump(k){ST.cur=k;renderQ()}
function isOk(q,a){
  if(a===undefined||a===null)return false;
  if(q.t==='mcq')return a===q.a;
  if(q.t==='tf')return a===q.a;
  if(q.t==='fill'){var n=norm(a);return [q.a].concat(arrOf(q.alt)).some(function(x){return norm(x)===n})}
  if(q.t==='match')return arrOf(a).length===q.pairs.length&&arrOf(a).every(function(v,k){return v===k});
  if(q.t==='order')return arrOf(a).length===q.items.length&&arrOf(a).every(function(v,k){return v===k});
  return false;
}
function confirmSubmit(){
  var un=0;ST.ex.questions.forEach(function(_,i){if(!isAnswered(i))un++});
  var d=document.createElement('div');d.id='cfm';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
  d.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px;max-width:360px;width:100%;text-align:center"><p style="line-height:1.8;margin-bottom:14px">'+(un?'<b class="red">'+L.unans+un+'</b><br>':'')+L.confirm+'</p><button class="btn" id="cfY">'+(L.dir==='rtl'?'نعم، سلّم':'Yes, submit')+'</button> <button class="btn gr" id="cfN">'+(L.dir==='rtl'?'رجوع':'Back')+'</button></div>';
  document.body.appendChild(d);
  $('cfY').onclick=function(){d.remove();doSubmit()};$('cfN').onclick=function(){d.remove()};
}
function doSubmit(){
  if(!ST||!ST.active)return;ST.active=false;clearInterval(tInt);clearInterval(saveInt);
  var qs=ST.ex.questions,flags='',b=[[0,0],[0,0],[0,0]],oc={},cor=0;
  qs.forEach(function(q,i){var a=ST.ans[i];if(a===undefined)a=getAnsSafe(i);var ok=isOk(q,a);flags+=ok?'1':'0';if(ok)cor++;
    var bl=Math.min(3,Math.max(1,q.bloom||1))-1;b[bl][1]++;if(ok)b[bl][0]++;
    var on=q.outcome||'—';if(!oc[on])oc[on]=[0,0];oc[on][1]++;if(ok)oc[on][0]++});
  var res={sid:ST.sid,name:$('sName').textContent,sec:ST.sec,exam:ST.ex.id,score:cor,total:qs.length,pct:Math.round(cor/qs.length*100),
    flags:flags,bloom:b,outcomes:Object.keys(oc).map(function(k){return{n:k,c:oc[k][0],t:oc[k][1]}}),time:Math.round(elapsed()),ts:now()};
  var ex=ST.ex,sec=ST.sec,sid=ST.sid;
  var o={};o[P.res+'/'+ex.id+'/'+sid]=res;o[P.act+'/'+ex.id+'/'+sid]=null;
  db.ref().update(o).then(function(){showResult(res,ex,sec,sid,false)}).catch(function(e){alert('تعذر حفظ النتيجة: '+e.message);ST.active=true;tInt=setInterval(tick,1000)});
  ST=null;
}
function getAnsSafe(i){var q=ST.ex.questions[i];return (q.t==='order'||q.t==='match')?qDefault(q,i):undefined}

function showResult(res,ex,sec,sid,again){

function colorFor(p){return p>=80?'#27ae60':p>=60?'#2d9e5f':p>=50?'#f0a500':'#c0392b'}
function analysisHTML(res,ex,pr,again){
  var p=res.pct,h='<div class="rc" style="text-align:center">'+(again?'<div class="note">'+L.done+'</div>':'');
  h+='<div class="circ" style="background:'+colorFor(p)+'">'+p+'%<div style="font-size:.75rem;font-weight:600">'+L.score+'</div></div>';
  h+='<h2>'+L.msgs[p>=85?0:p>=70?1:p>=50?2:3]+'</h2>';
  var m=Math.floor(res.time/60),s=res.time%60;
  h+='<div class="stats"><div class="sb"><div class="n ok-m">'+res.score+'</div><div class="l">'+L.cor+'</div></div><div class="sb"><div class="n bad-m">'+(res.total-res.score)+'</div><div class="l">'+L.wrong+'</div></div><div class="sb"><div class="n">'+m+':'+pad(s)+'</div><div class="l">'+L.time+'</div></div></div>';
  // progress
  h+='<div style="margin:8px 0">';
  if(pr){var d=p-pr.pct;h+='<span class="tag '+(d>0?'g':d<0?'r':'b')+'">'+L.prog+': '+(d>0?L.up+' '+d+'%':d<0?L.down+' '+(-d)+'%':L.same)+' ('+pr.pct+'% → '+p+'%)</span>'}
  else h+='<span class="tag b">'+L.first+'</span>';
  h+='</div></div>';
  // bloom
  var bn=[L.b1,L.b2,L.b3],bc=['#2d9e5f','#0d4f8b','#f0a500'];
  h+='<div class="rc"><h3 style="margin-bottom:8px">'+L.bloom+'</h3>'+arrOf(res.bloom).map(function(x,i){x=arrOf(x);var pc=x[1]?Math.round(x[0]/x[1]*100):0;return x[1]?'<div class="bar"><span style="width:150px">'+bn[i]+'</span><div class="bg"><div class="f" style="width:'+pc+'%;background:'+bc[i]+'"></div></div><b>'+x[0]+'/'+x[1]+'</b></div>':''}).join('')+'</div>';
  // outcomes
  var oc=arrOf(res.outcomes),strong=oc.filter(function(o){return o.t&&o.c/o.t>=0.7}),weak=oc.filter(function(o){return o.t&&o.c/o.t<0.7});
  h+='<div class="rc"><h3 style="margin-bottom:8px">'+L.out+'</h3>';

  if(weak.length)h+='<div><b>'+L.weak+':</b><br>'+weak.map(function(o){return'<span class="tag r">'+esc(o.n)+' ('+o.c+'/'+o.t+')</span>'}).join('')+'</div>';
  if(weak.length)h+='<div class="note" style="margin-top:10px"><b>'+L.adv+':</b> '+L.advT+weak.map(function(o){return esc(o.n)}).join(' ، ')+'</div>';
  h+='</div>';
  // review
  var qs=ex.questions;
  h+='<div class="rc"><h3 style="margin-bottom:8px">'+L.rev+'</h3>'+qs.map(function(q,i){var ok=res.flags.charAt(i)==='1';
    var s='<div class="pq"><b>'+(i+1)+'.</b> '+(ok?'✅':'❌')+' '+esc(q.q);
    if(ex.showAnswers&&!ok){s+='<div style="margin-top:4px" class="grn">'+L.corA+': '+esc(correctText(q))+'</div>';if(q.expl)s+='<div style="color:#666;margin-top:3px">'+esc(q.expl)+'</div>'}
    return s+'</div>'}).join('')+'</div>';
  h+='<div style="text-align:center"><button class="btn" onclick="goHome()">'+L.home+'</button></div>';
  return h;
}
function correctText(q){
  if(q.t==='mcq')return q.opts[q.a];
  if(q.t==='tf')return q.a?L.t:L.f;
  if(q.t==='fill')return [q.a].concat(arrOf(q.alt)).join(' / ');
  if(q.t==='match')return q.pairs.map(function(p){return p[0]+' → '+p[1]}).join(' ؛ ');
  if(q.t==='order')return q.items.map(function(x,i){return (i+1)+') '+x}).join('  ');

}

function parseExam(txt){
  var o;try{o=JSON.parse(txt.replace(/^﻿/,'').trim())}catch(e){alert('تعذر قراءة الملف: ليس JSON صالحاً.\n'+e.message);return}
  var err=validateExam(o);if(err.length){alert('أخطاء في ملف الاختبار:\n- '+err.slice(0,10).join('\n- '));return}
  PEND={title:o.title||'اختبار جديد',duration:o.duration||30,showAnswers:!!o.showAnswers,questions:o.questions,openAt:0,closeAt:0,status:'published',id:null};
  renderPend();
}
function validateExam(o){
  var e=[];if(!o||!Array.isArray(o.questions)||!o.questions.length){return['لا توجد أسئلة (questions)']}
  o.questions.forEach(function(q,i){var n='س'+(i+1)+': ';
    if(!q.q)e.push(n+'نص السؤال مفقود');
    if(q.t==='mcq'){if(!Array.isArray(q.opts)||q.opts.length<2)e.push(n+'خيارات mcq ناقصة');if(typeof q.a!=='number'||!q.opts||q.a<0||q.a>=q.opts.length)e.push(n+'رقم الإجابة a غير صحيح')}
    else if(q.t==='tf'){if(typeof q.a!=='boolean')e.push(n+'a يجب أن تكون true أو false')}
    else if(q.t==='fill'){if(!q.a)e.push(n+'إجابة fill مفقودة')}
    else if(q.t==='match'){if(!Array.isArray(q.pairs)||q.pairs.length<2)e.push(n+'pairs ناقصة')}
    else if(q.t==='order'){if(!Array.isArray(q.items)||q.items.length<2)e.push(n+'items ناقصة')}
    else e.push(n+'نوع غير معروف: '+q.t);
    if(!q.bloom||q.bloom<1||q.bloom>3)q.bloom=1;
  });return e;
}

  var b=[['ناتج التعلم','الصحيح','الإجمالي','النسبة %','الحكم']];Object.keys(oc).forEach(function(n){var p=Math.round(oc[n][0]/oc[n][1]*100);b.push([n,oc[n][0],oc[n][1],p,p<50?'يحتاج دعماً':p<70?'يحتاج مراجعة':'متحقق'])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(b),'النواتج');
  var qs=arrOf(e.questions),nr=Object.keys(rs).length,c=[['#','النوع','السؤال','بلوم','الناتج','% الصحيح']];
  qs.forEach(function(q,i){var k=0;Object.keys(rs).forEach(function(id){if(rs[id].flags.charAt(i)==='1')k++});c.push([i+1,TN[q.t],q.q,q.bloom,q.outcome||'',nr?Math.round(k/nr*100):''])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(c),'الأسئلة');
  XLSX.writeFile(wb,secOf(CURSEC).id+'_'+e.title.replace(/[\\/:*?"<>|]/g,'_')+'.xlsx');
}

// ── progress ──
function renderProgress(){
  destroyCharts();
  var ls=secExams(CURSEC).filter(function(e){return e.status!=='draft'}),sts=STUDENTS[CURSEC];
  if(!ls.length){$('subBody').innerHTML='<div class="pn"><div class="note">لا توجد اختبارات منشورة بعد.</div></div>';return}
  var rows=sts.map(function(s){var ps=ls.map(function(e){var r=(RES[e.id]||{})[s.id];return r?r.pct:null});
    var got=ps.filter(function(x){return x!==null}),last=got.length?got[got.length-1]:null,prev=got.length>1?got[got.length-2]:null,flag='';
    if(last!==null){if(last<50)flag='دون 50%';if(prev!==null&&last-prev<=-15)flag+=(flag?' + ':'')+'تراجع حاد';if(got.length>2&&got[got.length-1]<got[got.length-2]&&got[got.length-2]<got[got.length-3])flag+=(flag?' + ':'')+'تراجع متتالٍ'}
    var missed=ps.filter(function(x){return x===null}).length;if(missed>=2&&got.length)flag+=(flag?' + ':'')+'غياب عن '+missed;
    return {s:s,ps:ps,last:last,prev:prev,flag:flag,avg:got.length?Math.round(got.reduce(function(a,b){return a+b},0)/got.length):null}});
  var h='<div class="pn"><h3>📈 تقدم طلاب '+secOf(CURSEC).ar+'</h3><div class="row"><div style="flex:none"><button class="btn s" onclick="exportProg()">📥 تصدير Excel</button></div></div>';
  h+='<div class="tw" style="margin-top:10px"><table><tr><th>الطالب</th>'+ls.map(function(e){return'<th>'+esc(e.title)+'</th>'}).join('')+'<th>المتوسط</th><th>الاتجاه</th><th>تنبيه</th></tr>';
  rows.forEach(function(r){var tr=r.prev===null||r.last===null?'—':(r.last>r.prev?'<span class="grn">▲ +'+(r.last-r.prev)+'</span>':r.last<r.prev?'<span class="red">▼ '+(r.last-r.prev)+'</span>':'● 0');
    h+='<tr><td class="n '+(r.last!==null&&r.last<50?'red':'')+'"><a class="lnk" style="margin:0;color:inherit" onclick="stuChart(\''+r.s.id+'\')">'+esc(r.s.ar)+'</a></td>'+r.ps.map(function(p){return'<td class="'+(p!==null&&p<50?'red':'')+'">'+(p===null?'—':p+'%')+'</td>'}).join('')+'<td>'+(r.avg===null?'—':r.avg+'%')+'</td><td>'+tr+'</td><td>'+(r.flag?'<span class="tag r">'+r.flag+'</span>':'')+'</td></tr>'});
  h+='</table></div></div><div class="pn"><h3 id="pcTitle">متوسط الشعبة عبر الأسابيع</h3><canvas id="chProg" height="110"></canvas></div>';
  $('subBody').innerHTML=h;window._ls=ls;window._rows=rows;stuChart(null);
}
function stuChart(sid){
  var ls=window._ls,avg=ls.map(function(e){var v=Object.keys(RES[e.id]||{}).map(function(k){return RES[e.id][k].pct});return v.length?Math.round(v.reduce(function(a,b){return a+b},0)/v.length):null});
  var ds=[{label:'متوسط الشعبة',data:avg,borderColor:'#0d4f8b',backgroundColor:'#0d4f8b',tension:.25,spanGaps:true}];
  if(sid){var s=STUDENTS[CURSEC].filter(function(x){return x.id===sid})[0];$('pcTitle').textContent='تقدّم: '+s.ar;
    ds.push({label:s.ar,data:ls.map(function(e){var r=(RES[e.id]||{})[sid];return r?r.pct:null}),borderColor:'#c0392b',backgroundColor:'#c0392b',tension:.25,spanGaps:true})}
  if(charts.p)charts.p.destroy();
  charts.p=new Chart($('chProg'),{type:'line',data:{labels:ls.map(function(e){return e.title}),datasets:ds},options:{scales:{y:{min:0,max:100}}}});
}
function exportProg(){
  var ls=window._ls,rows=window._rows,wb=XLSX.utils.book_new();
  var a=[['الطالب','Name','رقم الطالب'].concat(ls.map(function(e){return e.title})).concat(['المتوسط','آخر تغيّر','تنبيه'])];
  rows.forEach(function(r){a.push([r.s.ar,r.s.en,r.s.id].concat(r.ps.map(function(p){return p===null?'':p})).concat([r.avg===null?'':r.avg,r.prev===null||r.last===null?'':r.last-r.prev,r.flag]))});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),'التقدم');XLSX.writeFile(wb,'progress_'+CURSEC+'.xlsx');
}

// ══════ INIT ══════
initLogin();SS('homeScreen');$('lov').style.display='none';
</script>
